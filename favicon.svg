<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="indigo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Linked Data Graph Node Connectors -->
  <g stroke="rgba(129, 140, 248, 0.4)" stroke-width="5" stroke-dasharray="6,6">
    <line x1="160" y1="160" x2="352" y2="160" />
    <line x1="160" y1="160" x2="256" y2="340" />
    <line x1="352" y1="160" x2="256" y2="340" />
    <line x1="256" y1="340" x2="180" y2="400" />
    <line x1="256" y1="340" x2="332" y2="400" />
  </g>

  <!-- Graph Nodes -->
  <circle cx="160" cy="160" r="22" fill="#312e81" stroke="#818cf8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="352" cy="160" r="22" fill="#312e81" stroke="#818cf8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="180" cy="400" r="16" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="3"/>
  <circle cx="332" cy="400" r="16" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="3"/>

  <!-- Central Musical Note & Schema Node Combined Motif -->
  <circle cx="256" cy="240" r="88" fill="url(#amber-glow)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Music Note Vector -->
  <path d="M220 320 A 30 25 0 1 1 190 295 L 190 150 C 190 140 200 135 210 132 L 320 102 C 328 100 336 106 336 115 L 336 270 A 30 25 0 1 1 306 245 L 306 160 L 220 184 L 220 320 Z" 
        fill="url(#amber-glow)" 
        filter="url(#glow)"/>
  
  <!-- Schema JSON Brackets Accent -->
  <text x="70" y="270" font-family="monospace" font-size="84" font-weight="900" fill="#818cf8" opacity="0.8">{</text>
  <text x="395" y="270" font-family="monospace" font-size="84" font-weight="900" fill="#818cf8" opacity="0.8">}</text>
  
  <!-- Small SEO Sparkle -->
  <path d="M 256 50 L 262 70 L 282 76 L 262 82 L 256 102 L 250 82 L 230 76 L 250 70 Z" fill="#fbbf24" filter="url(#glow)"/>
</svg>
